<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <select name="Age" id="age">
        <option value="kids">kids 8-10y</option>
        <option value="tweens">tweens 11-13y</option>
        <option value="teens">teens 14-16y</option>
        <option value="adult">adult 17-21y</option>
    </select>
    <div class="form">
    <h3 class="title">Coding Competition <br> Enrollment 2021</h3>
    <form action="res.html" target="blank" method="GET" autocomplete="on" novalidate>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">

        <label for="email">Email</label>
        <input type="text" id="email" name="email">

        <label for="address">Address</label>
        <textarea id="address" name="address" cols="30" rows="10"></textarea>

        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone">

        <input type="submit" value="Submit" class="submit-btn">
    </form>
</div>
</body>
</html>
