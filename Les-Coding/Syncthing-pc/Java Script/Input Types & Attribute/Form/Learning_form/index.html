<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    </select>
    <div class="form">
    <h3 class="title">Coding Competition <br> Enrollment 2021</h3>
    <form action="res.html" target="blank" method="GET" autocomplete="on" novalidate>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <label for="address">Address</label>
        <textarea id="address" name="address" cols="30" rows="10"></textarea>

        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone">

        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="8" max="21">

        <input type="submit" value="Submit" class="submit-btn">
    </form>
</div>
</body>
</html>
